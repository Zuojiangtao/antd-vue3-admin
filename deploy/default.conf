# 开启gzip
gzip on;
# 启用gzip压缩的最小文件；小于设置值的文件将不会被压缩
gzip_min_length 1k;
# gzip 压缩级别 1-10
gzip_comp_level 6;
# 处理请求压缩的缓冲区数量和大小
gzip_buffers 16 8k;
# 识别http协议的版本，默认在http/1.0的协议下不开启gzip压缩
gzip_http_version 1.1;
# 表明哪些UA头不使用gzip压缩，避免对老旧浏览器（如 IE6）发送 Gzip 内容导致问题
gzip_disable "msie6";
# 进行压缩的文件类型。
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml
  font/woff2
  font/ttf;
# 是否在http header中添加Vary: Accept-Encoding，建议开启
gzip_vary on;

server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    # 可选：强制 HTTPS（如果已有证书）
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;

    # 对 index.html 启用协商缓存
    location = /index.html {
        # 禁止强缓存，每次访问都向服务器验证
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        # 安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # 仅HTTPS
        # ETag 和 Last-Modified 默认开启，此处显式确保
        etag on;
        if_modified_since exact;   # 支持 If-Modified-Since 头
    }

    # 静态资源强缓存
    location ~* \.(css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # 安全头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # 仅HTTPS
}

    # 错误页面
    error_page 500 502 503 504  /50x.html;
    location = /50x.html {}
}
